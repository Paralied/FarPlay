services:
  signal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
volumes:
  caddy_data:
  caddy_config:
