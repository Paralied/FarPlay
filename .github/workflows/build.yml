name: Build FarPlay prototypes
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build host
        shell: pwsh
        run: ./host/build.ps1
      - name: Verify direct pairing and streaming
        shell: pwsh
        run: ./host/.venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Verify packaged host starts
        shell: pwsh
        run: |
          $p = Start-Process ./host/dist/FarPlayHost.exe -ArgumentList "--self-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Host startup timed out" }
          if ($p.ExitCode -ne 0) { throw "Host startup failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: FarPlay-Windows
          path: host/dist/FarPlayHost.exe
          if-no-files-found: error
  android:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify mobile controls
        run: node tests/mobile-controls.cjs
      - run: gradle --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FarPlay-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  release:
    name: Publish downloads
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FarPlay-Windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: FarPlay-Android
          path: release
      - name: Publish prototype release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.2.4-build.${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mv release/app-debug.apk release/FarPlay-Android.apk
          cat > release-notes.md <<'NOTES'
          FarPlay remote setup update: UPnP + NAT-PMP, guided router/firewall setup, authenticated internet-address syncing, clear mobile-data errors, and clean F11/windowed exit from FarPlay borderless mode.
          Update BOTH packages. On the PC choose Remote access setup > Enable remote access, connect once on home Wi-Fi to sync the address, then disconnect and test with Wi-Fi off.
          Direct access still depends on router and ISP support; shared/private WAN addresses may require an ISP or upstream-router change. No relay, VPN, or hosted service is installed.

          Download FarPlayHost.exe for Windows and FarPlay-Android.apk for Android.
          The Windows package passes an automated startup check. Real-device streaming remains unverified.
          Update BOTH the PC host and Android app for the latency improvements and new mouse/fullscreen controls.
          Open the PC EXE, choose Pair my phone, scan its QR code in the Android app, then tap Connect.
          Automatic router mapping is attempted. If the router blocks it, see Network setup in the PC app. CGNAT can still prevent remote access.
          Direct WebRTC streaming falls back to direct TCP compatibility mode when needed. Real-device gaming performance is not yet verified.
          Android test builds may require uninstalling an older APK before installation.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" release/FarPlayHost.exe release/FarPlay-Android.apk --target "$RELEASE_COMMIT" --title "FarPlay $RELEASE_TAG (prototype)" --notes-file release-notes.md --prerelease
          fi
