name: Build FarPlay prototypes
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build host
        shell: pwsh
        run: ./host/build.ps1
      - name: Verify packaged host starts
        shell: pwsh
        run: |
          $p = Start-Process ./host/dist/FarPlayHost.exe -ArgumentList "--self-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Host startup timed out" }
          if ($p.ExitCode -ne 0) { throw "Host startup failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: FarPlay-Windows
          path: host/dist/FarPlayHost.exe
          if-no-files-found: error
  android:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FarPlay-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
